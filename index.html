<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Make Your Bouquet ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Playfair+Display:wght@500&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f8eee9;
    color: #5d4944;
    font-family: "DM Sans", sans-serif;
}

header {
    text-align: center;
    padding: 35px 20px 20px;
}

header h1 {
    font-family: "Playfair Display", serif;
    font-size: 42px;
    font-weight: 500;
    margin: 0;
}

header p {
    color: #9b8179;
    margin-top: 8px;
}

.app {
    width: min(1100px, 94%);
    margin: auto;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 20px;
}

/* LEFT MENU */

.sidebar {
    background: #fffaf7;
    border: 1px solid #eadbd5;
    border-radius: 25px;
    padding: 20px;
    box-shadow: 0 10px 35px rgba(90, 60, 50, .08);
}

.section {
    margin-bottom: 25px;
}

.section-title {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #a17e75;
    margin-bottom: 12px;
}

.flower-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.flower-button {
    background: white;
    border: 1px solid #eadbd5;
    border-radius: 15px;
    padding: 8px;
    cursor: pointer;
    transition: .2s;
    color: #624d47;
}

.flower-button:hover {
    transform: translateY(-3px);
    border-color: #cfa69c;
}

.flower-button img {
    width: 65px;
    height: 65px;
    object-fit: contain;
}

.flower-name {
    font-size: 12px;
}

/* WRAPPING */

.wraps {
    display: flex;
    gap: 10px;
}

.wrap {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 2px solid white;
    cursor: pointer;
    box-shadow: 0 0 0 1px #d9cbc5;
}

.wrap.active {
    box-shadow: 0 0 0 2px #a87970;
}

/* MESSAGE */

textarea {
    width: 100%;
    border: 1px solid #e2d2cc;
    border-radius: 13px;
    padding: 10px;
    resize: none;
    font-family: inherit;
    color: #604d47;
}

/* BOUQUET */

.stage {
    background: #fffaf7;
    border: 1px solid #eadbd5;
    border-radius: 25px;
    padding: 18px;
    box-shadow: 0 10px 35px rgba(90, 60, 50, .08);
}

.bouquet {
    position: relative;
    height: 600px;
    overflow: hidden;
    border-radius: 20px;
    background: #fbf5f1;
}

/* tiny dots */

.bouquet::before {
    content: "";
    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(#dfd0ca 1px, transparent 1px);

    background-size: 22px 22px;
    opacity: .35;
}

/* WRAPPING PAPER */

.paper {
    position: absolute;
    width: 340px;
    height: 330px;

    bottom: -130px;
    left: 50%;

    transform: translateX(-50%) rotate(45deg);

    border-radius: 25px 25px 8px 8px;

    z-index: 1;
}

/* FLOWERS */

.flower {
    position: absolute;

    width: 110px;
    height: 110px;

    object-fit: contain;

    cursor: grab;

    user-select: none;

    z-index: 5;

    filter:
        drop-shadow(0 5px 4px rgba(60,40,30,.12));

    transition: filter .15s;
}

.flower:active {
    cursor: grabbing;
}

.flower:hover {
    filter:
        drop-shadow(0 8px 7px rgba(60,40,30,.18));
}

/* RIBBON */

.ribbon {
    position: absolute;

    width: 80px;
    height: 50px;

    bottom: 78px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;
}

.ribbon-left,
.ribbon-right {
    position: absolute;

    width: 35px;
    height: 28px;

    border: 7px solid #c98f8b;

    border-radius: 70% 20% 70% 20%;
}

.ribbon-left {
    left: 0;
    transform: rotate(25deg);
}

.ribbon-right {
    right: 0;
    transform: scaleX(-1) rotate(25deg);
}

.ribbon-center {
    position: absolute;

    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: #c98f8b;

    left: 31px;
    top: 12px;
}

/* MESSAGE */

.message {
    position: absolute;

    bottom: 18px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 30;

    background: rgba(255,250,247,.92);

    padding: 7px 14px;

    border-radius: 12px;

    font-family: "Playfair Display", serif;

    font-size: 13px;

    max-width: 80%;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

/* BUTTONS */

.buttons {
    display: flex;

    justify-content: center;

    gap: 10px;

    margin-top: 15px;
}

button.action {
    border: none;

    border-radius: 14px;

    padding: 11px 20px;

    cursor: pointer;

    font-family: inherit;

    transition: .2s;
}

.reset {
    background: #eee0db;
    color: #705750;
}

.random {
    background: #c98f8b;
    color: white;
}

button.action:hover {
    transform: translateY(-2px);
}

/* MOBILE */

@media(max-width: 750px) {

    .app {
        grid-template-columns: 1fr;
    }

    .sidebar {
        order: 2;
    }

    .stage {
        order: 1;
    }

    .bouquet {
        height: 500px;
    }

    header h1 {
        font-size: 34px;
    }
}
</style>
</head>

<body>

<header>

    <h1>Make Your Bouquet ♡</h1>

    <p>
        Pick your flowers and create something beautiful.
    </p>

</header>


<div class="app">

<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar">

    <div class="section">

        <div class="section-title">
            Flowers
        </div>

        <div class="flower-buttons">

            <button class="flower-button"
                onclick="addFlower('rose')">

                <img src="https://www.kindpng.com/picc/m/309-3094293_watercolor-roses-png-transparent-png.png">

                <div class="flower-name">
                    Rose
                </div>

            </button>


            <button class="flower-button"
                onclick="addFlower('daisy')">

                <img src="https://www.kindpng.com/picc/m/110-1109266_daisy-flower-png-transparent-png.png">

                <div class="flower-name">
                    Daisy
                </div>

            </button>


            <button class="flower-button"
                onclick="addFlower('peony')">

                <img src="https://www.kindpng.com/picc/m/81-813633_common-peony-hand-painted-rose-png-transparent-png.png">

                <div class="flower-name">
                    Peony
                </div>

            </button>


            <button class="flower-button"
                onclick="addFlower('pink')">

                <img src="https://www.kindpng.com/picc/m/59-592382_watercolour-flowers-watercolor-painting-rose-art-vector-watercolor.png">

                <div class="flower-name">
                    Pink Bloom
                </div>

            </button>

        </div>

    </div>


    <!-- WRAPPING -->

    <div class="section">

        <div class="section-title">
            Wrapping
        </div>

        <div class="wraps">

            <button
                class="wrap active"
                style="background:#f2d6d5"
                onclick="changeWrap('#f2d6d5',this)">
            </button>

            <button
                class="wrap"
                style="background:#eee3d4"
                onclick="changeWrap('#eee3d4',this)">
            </button>

            <button
                class="wrap"
                style="background:#d9e2d1"
                onclick="changeWrap('#d9e2d1',this)">
            </button>

            <button
                class="wrap"
                style="background:#d9d5e7"
                onclick="changeWrap('#d9d5e7',this)">
            </button>

            <button
                class="wrap"
                style="background:#e8c8b9"
                onclick="changeWrap('#e8c8b9',this)">
            </button>

        </div>

    </div>


    <!-- MESSAGE -->

    <div class="section">

        <div class="section-title">
            Message
        </div>

        <textarea
            id="messageInput"
            rows="3"
            maxlength="55"
            placeholder="write something sweet ♡"
            oninput="updateMessage()">
        </textarea>

    </div>


    <div style="
        font-size:12px;
        line-height:1.7;
        color:#9a8179;
    ">

        ✿ Click a flower to add it.<br>
        ✿ Drag flowers around to arrange them.<br>
        ✿ Double-click a flower to remove it.

    </div>

</aside>


<!-- =========================
     BOUQUET
========================= -->

<main class="stage">

    <div class="bouquet" id="bouquet">

        <div
            class="paper"
            id="paper"
            style="background:#f2d6d5">
        </div>


        <div class="ribbon">

            <div class="ribbon-left"></div>

            <div class="ribbon-right"></div>

            <div class="ribbon-center"></div>

        </div>


        <div
            class="message"
            id="message">
            a little bouquet for you ♡
        </div>

    </div>


    <div class="buttons">

        <button
            class="action reset"
            onclick="resetBouquet()">

            Reset

        </button>


        <button
            class="action random"
            onclick="randomBouquet()">

            Surprise me ✿

        </button>

    </div>

</main>

</div>


<script>

/* ==================================
   FLOWER IMAGES
================================== */

const flowerImages = {

    rose:
    "https://www.kindpng.com/picc/m/309-3094293_watercolor-roses-png-transparent-png.png",

    daisy:
    "https://www.kindpng.com/picc/m/110-1109266_daisy-flower-png-transparent-png.png",

    peony:
    "https://www.kindpng.com/picc/m/81-813633_common-peony-hand-painted-rose-png-transparent-png.png",

    pink:
    "https://www.kindpng.com/picc/m/59-592382_watercolour-flowers-watercolor-painting-rose-art-vector-watercolor.png"

};


/* ==================================
   ADD FLOWER
================================== */

function addFlower(type) {

    const bouquet =
        document.getElementById("bouquet");


    const flower =
        document.createElement("img");


    flower.src =
        flowerImages[type];


    flower.className =
        "flower";


    /*
       Random starting position
    */

    const x =
        35 + Math.random() * 30;

    const y =
        25 + Math.random() * 35;


    flower.style.left =
        x + "%";


    flower.style.top =
        y + "%";


    /*
       Random rotation
    */

    flower.style.transform =
        `rotate(${Math.random()*40-20}deg)`;


    bouquet.appendChild(flower);


    /*
       DOUBLE CLICK = REMOVE
    */

    flower.addEventListener(
        "dblclick",
        function(){

            flower.remove();

        }
    );


    /*
       DRAG SYSTEM
    */

    makeDraggable(flower);

}


/* ==================================
   DRAG FLOWER
================================== */

function makeDraggable(element) {

    let dragging = false;

    let offsetX = 0;
    let offsetY = 0;


    element.addEventListener(
        "pointerdown",
        function(e){

            dragging = true;

            element.setPointerCapture(e.pointerId);


            const rect =
                element.getBoundingClientRect();


            offsetX =
                e.clientX - rect.left;


            offsetY =
                e.clientY - rect.top;


            element.style.zIndex = 50;

        }
    );


    element.addEventListener(
        "pointermove",
        function(e){

            if(!dragging)
                return;


            const bouquet =
                document.getElementById("bouquet");


            const rect =
                bouquet.getBoundingClientRect();


            let x =
                e.clientX -
                rect.left -
                offsetX;


            let y =
                e.clientY -
                rect.top -
                offsetY;


            /*
               Keep flower inside bouquet
            */

            x =
                Math.max(
                    0,
                    Math.min(
                        rect.width - element.offsetWidth,
                        x
                    )
                );


            y =
                Math.max(
                    0,
                    Math.min(
                        rect.height - element.offsetHeight,
                        y
                    )
                );


            element.style.left =
                x + "px";


            element.style.top =
                y + "px";

        }
    );


    element.addEventListener(
        "pointerup",
        function(){

            dragging = false;

        }
    );

}


/* ==================================
   WRAPPING PAPER
================================== */

function changeWrap(color, button) {

    document
        .getElementById("paper")
        .style.background =
        color;


    document
        .querySelectorAll(".wrap")
        .forEach(
            x => x.classList.remove("active")
        );


    button.classList.add("active");

}


/* ==================================
   MESSAGE
================================== */

function updateMessage() {

    const value =
        document
        .getElementById("messageInput")
        .value
        .trim();


    document
        .getElementById("message")
        .textContent =
        value ||
        "a little bouquet for you ♡";

}


/* ==================================
   RESET
================================== */

function resetBouquet() {

    document
        .querySelectorAll(".flower")
        .forEach(
            flower => flower.remove()
        );


    document
        .getElementById("messageInput")
        .value = "";


    updateMessage();

}


/* ==================================
   RANDOM BOUQUET
================================== */

function randomBouquet() {

    resetBouquet();


    const types =
        Object.keys(flowerImages);


    const amount =
        5 + Math.floor(
            Math.random() * 5
        );


    for(
        let i = 0;
        i < amount;
        i++
    ){

        const randomType =
            types[
                Math.floor(
                    Math.random() *
                    types.length
                )
            ];


        addFlower(randomType);

    }

}

</script>

</body>
  </html>
